name: Release

# Two ways in:
#
#   * pushing a `v*` tag  — the real release: images go to GHCR, the client
#     tarballs are attached to a GitHub Release;
#   * workflow_dispatch    — a release-candidate rehearsal. With `dry_run`
#     left at its default everything is built and packed, nothing is pushed,
#     tagged or published, and the artifacts are attached to the workflow run
#     so they can be inspected before a tag exists.
#
# Actions are pinned by commit SHA; the trailing comment records the version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack without pushing images or creating a release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            # A tag that disagrees with the manifest would produce artifacts
            # whose embedded asset URLs point at a different release.
            if [ "v${version}" != "${tag}" ]; then
              echo "::error::tag ${tag} does not match package.json version ${version}"
              exit 1
            fi
            publish=true
          else
            tag="v${version}"
            publish=false
          fi
          case "${version}" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
            echo "publish=${publish}"
          } >> "${GITHUB_OUTPUT}"
          echo "Releasing ${tag} (prerelease=${prerelease}, publish=${publish})" >> "${GITHUB_STEP_SUMMARY}"

  check:
    name: Build, lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  images:
    name: ${{ matrix.component }} image
    runs-on: ubuntu-24.04
    needs: [meta, check]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            context: .
            dockerfile: images/server/Dockerfile
          - component: sandbox
            context: images/sandbox
            dockerfile: images/sandbox/Dockerfile
          - component: firewall
            context: images/firewall
            dockerfile: images/firewall/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sandbox-broker-${{ matrix.component }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          image="$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')"
          tags="${image}:${VERSION},${image}:sha-${GITHUB_SHA::12}"
          # `latest` must never point at a release candidate.
          if [ "${PRERELEASE}" != "true" ]; then
            tags="${tags},${image}:latest"
          fi
          {
            echo "image=${image}"
            echo "tags=${tags}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build${{ needs.meta.outputs.publish == 'true' && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ needs.meta.outputs.publish == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Record digest
        shell: bash
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p digests
          if [ -n "${DIGEST}" ]; then
            reference="${IMAGE}@${DIGEST}"
          else
            reference="${IMAGE}:${VERSION} (not pushed; dry run)"
          fi
          echo "${reference}" > "digests/${{ matrix.component }}.txt"
          echo "- \`${reference}\`" >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.component }}
          path: digests/${{ matrix.component }}.txt
          retention-days: 7

  packages:
    name: Client tarballs
    runs-on: ubuntu-24.04
    needs: [meta, check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `--verify` packs twice from a clean rebuild and fails if the two runs
      # differ, so an attached tarball is a function of the sources alone.
      - name: Pack
        env:
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
        run: bash scripts/pack-release.sh --verify

      - name: Summarize
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Client artifacts"
            echo '```'
            cat dist/release/SHA256SUMS
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-tarballs
          path: dist/release/
          retention-days: 7

  release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    needs: [meta, images, packages]
    if: needs.meta.outputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Compose release notes
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "## Images"
            echo
            echo "Pin by digest:"
            echo
            echo '```'
            cat artifacts/server.txt artifacts/sandbox.txt artifacts/firewall.txt
            echo '```'
            echo
            echo "## Client"
            echo
            echo "Install without a registry — the client tarball's manifest already"
            echo "points at the contracts tarball attached to this release:"
            echo
            echo '```bash'
            echo "pnpm add https://github.com/${REPO}/releases/download/${TAG}/sandbox-broker-client-${VERSION}.tgz"
            echo '```'
            echo
            echo '```'
            cat artifacts/SHA256SUMS
            echo '```'
          } > release-notes.md
          cat release-notes.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--title "${TAG}" --notes-file release-notes.md)
          if [ "${PRERELEASE}" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" "${flags[@]}"
          else
            gh release create "${TAG}" "${flags[@]}"
          fi
          gh release upload "${TAG}" \
            artifacts/*.tgz \
            artifacts/SHA256SUMS \
            --clobber

  npm:
    name: npm publish (opt-in)
    runs-on: ubuntu-24.04
    needs: [meta, release]
    # Disabled unless the repository explicitly opts in: publishing needs a
    # public `@sandbox-broker` scope that does not exist yet. Open Agents pins
    # the release tarball instead, so this is never on the critical path.
    if: vars.PUBLISH_NPM == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::PUBLISH_NPM is set but the NPM_TOKEN secret is missing"
            exit 1
          fi
          # Contracts first: the published client resolves it from the registry
          # rather than from the release asset URL used by the tarball flow.
          pnpm --filter @sandbox-broker/contracts publish --access public --no-git-checks
          pnpm --filter @sandbox-broker/client publish --access public --no-git-checks
